<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUPSync — Dev Preview</title>
  <link rel="stylesheet" href="/popup/popup.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .dev-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
      gap: 14px;
    }
    .dev-toolbar {
      width: var(--dev-frame-w, 320px);
      max-width: 100%;
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-size: 12px;
      color: #444;
    }
    .dev-toolbar h1 {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #7a0019;
    }
    .dev-toolbar p {
      margin: 0 0 10px;
      line-height: 1.5;
      color: #666;
    }
    .dev-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .dev-actions button {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      font-size: 11px;
      cursor: pointer;
    }
    .dev-actions button.active {
      background: #7a0019;
      color: #fff;
      border-color: #8b0000;
    }
    .dev-actions button:hover:not(.active) {
      border-color: #8b0000;
      color: #7a0019;
    }
    .dev-fixtures {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .dev-fixtures-label {
      font-size: 10px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      margin-bottom: 6px;
    }
    .dev-toolbar.wide {
      width: min(560px, 100%);
    }
    .popup-frame {
      width: var(--dev-frame-w, 320px);
      max-width: 100%;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      transition: width 0.15s ease;
    }

    body.popup-wide {
      --dev-frame-w: 600px;
    }
    .popup-frame body,
    .popup-frame > body {
      width: auto;
    }
  </style>
</head>
<body>
  <div class="dev-shell">
    <div class="dev-toolbar">
      <h1>PUPSync dev preview</h1>
      <p>Uses mock Chrome APIs and sample SIAS data. Import runs in dry-run mode with simulated progress.</p>
      <div class="dev-actions">
        <button type="button" id="btn-scene-sias" class="active">Schedule (State B)</button>
        <button type="button" id="btn-scene-grades">Grades / GWA (State E)</button>
        <button type="button" id="btn-scene-off">Landing (State A)</button>
        <button type="button" id="btn-scene-empty">No enlistment yet</button>
        <button type="button" id="btn-reload">Reload</button>
      </div>
      <div id="dev-grade-fixtures" class="dev-fixtures" hidden>
        <div class="dev-fixtures-label">Grade fixtures</div>
        <div class="dev-actions" id="dev-fixture-btns"></div>
      </div>
      <div id="dev-home-fixtures" class="dev-fixtures" hidden>
        <div class="dev-fixtures-label">Home fixtures</div>
        <div class="dev-actions" id="dev-home-fixture-btns">
          <button type="button" data-home="ontrack">On track</button>
          <button type="button" data-home="offtrack">Dropped / failed</button>
          <button type="button" data-home="empty">Empty landing</button>
        </div>
      </div>
    </div>

    <div class="popup-frame">
      <!-- Filled from /popup/popup.html so the preview never drifts from the real popup. -->
      <div id="popup-markup"></div>
      <script>
        (function () {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', '/popup/popup.html', false);
          xhr.send();
          const doc = new DOMParser().parseFromString(xhr.responseText, 'text/html');
          const host = document.getElementById('popup-markup');
          const header = doc.querySelector('header.header');
          const main = doc.querySelector('main#app');
          host.replaceWith(header, main);
        })();
      </script>
    </div>
  </div>

  <script src="/shared/constants.js"></script>
  <script src="/shared/utils.js"></script>
  <script src="/shared/calendar-sync.js"></script>
  <script src="/dev/fake-calendar.js"></script>
  <script src="/shared/schedule-grid-image.js"></script>
  <script src="/shared/gwa-share-image.js"></script>
  <script src="/shared/semester-config.js"></script>
  <script src="/dev/mock-data.js"></script>
  <script src="/dev/mock-grades.js"></script>
  <script src="/dev/mock-chrome.js"></script>
  <script src="/dev/mock-term.js"></script>
  <script src="/popup/popup.js"></script>
  <script>
    (function () {
      const scene = window.__PUPSYNC_DEV__.getScene();
      const btnSias = document.getElementById('btn-scene-sias');
      const btnGrades = document.getElementById('btn-scene-grades');
      const btnOff = document.getElementById('btn-scene-off');
      const btnEmpty = document.getElementById('btn-scene-empty');
      const fixtureWrap = document.getElementById('dev-grade-fixtures');
      const fixtureBtns = document.getElementById('dev-fixture-btns');
      const homeWrap = document.getElementById('dev-home-fixtures');
      const homeBtns = document.getElementById('dev-home-fixture-btns');
      const toolbar = document.querySelector('.dev-toolbar');
      const homeFixture = window.__PUPSYNC_DEV__.getHomeFixture();

      btnSias.classList.toggle('active', scene === 'schedule');
      btnGrades.classList.toggle('active', scene === 'grades');
      btnOff.classList.toggle('active', scene === 'off');
      btnEmpty.classList.toggle('active', scene === 'empty');
      btnSias.addEventListener('click', () => window.__PUPSYNC_DEV__.setScene('schedule'));
      btnGrades.addEventListener('click', () => window.__PUPSYNC_DEV__.setScene('grades', 'magna'));
      btnOff.addEventListener('click', () => window.__PUPSYNC_DEV__.setHomeFixture('ontrack'));
      btnEmpty.addEventListener('click', () => window.__PUPSYNC_DEV__.setScene('empty'));
      document.getElementById('btn-reload').addEventListener('click', () => window.__PUPSYNC_DEV__.reload());

      const fixtures = window.PUPSYNC_MOCK_GRADE_FIXTURES || {};
      const activeFixture = window.__PUPSYNC_DEV__.getGradeFixture();
      if (scene === 'grades' && fixtureWrap && fixtureBtns) {
        fixtureWrap.hidden = false;
        toolbar?.classList.add('wide');
        fixtureBtns.innerHTML = Object.entries(fixtures)
          .map(
            ([id, f]) =>
              `<button type="button" data-fixture="${id}" class="${id === activeFixture ? 'active' : ''}">${f.label || id}</button>`
          )
          .join('');
        fixtureBtns.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-fixture]');
          if (!btn) return;
          window.__PUPSYNC_DEV__.setGradeFixture(btn.dataset.fixture);
        });
      }

      if (scene === 'off' && homeWrap && homeBtns) {
        homeWrap.hidden = false;
        homeBtns.querySelectorAll('[data-home]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.home === homeFixture);
        });
        homeBtns.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-home]');
          if (!btn) return;
          window.__PUPSYNC_DEV__.setHomeFixture(btn.dataset.home);
        });
      }
    })();
  </script>
</body>
</html>
